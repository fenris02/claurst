[package]
authors.workspace      = true
edition.workspace      = true
license.workspace      = true
name                   = "claurst-tools"
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[dependencies]
anyhow       = { workspace = true }
async-trait  = { workspace = true }
base64       = { workspace = true }
bytes        = { workspace = true }
chrono       = { workspace = true }
claurst-api  = { workspace = true }
claurst-core = { workspace = true }
claurst-mcp  = { workspace = true }
dashmap      = { workspace = true }
dirs         = { workspace = true }
enigo        = { workspace = true, optional = true }
futures      = { workspace = true }
glob         = { workspace = true }
once_cell    = { workspace = true }
open         = { workspace = true }
parking_lot  = { workspace = true }
regex        = { workspace = true }
reqwest      = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
similar      = { workspace = true }
tempfile     = { workspace = true }
thiserror    = { workspace = true }
tokio        = { workspace = true }
tokio-stream = { workspace = true }
tokio-util   = { workspace = true }
tracing      = { workspace = true }
uuid         = { workspace = true }
walkdir      = { workspace = true }
which        = { workspace = true }
xcap         = { workspace = true, optional = true }

# PTY support — used by PtyBashTool on Unix
portable-pty = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[features]
computer-use = ["dep:enigo", "dep:xcap"]
