[package]
authors.workspace      = true
edition.workspace      = true
license.workspace      = true
name                   = "claurst-commands"
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[features]
# Pass-through features from cc-core
ultraplan = ["claurst-core/ultraplan"]

[dependencies]
anyhow            = { workspace = true }
arboard           = { version = "3", default-features = false }
async-trait       = { workspace = true }
base64            = { workspace = true }
chrono            = { workspace = true }
claurst-api       = { workspace = true }
claurst-bridge    = { workspace = true }
claurst-core      = { workspace = true }
claurst-mcp       = { workspace = true }
claurst-plugins   = { workspace = true }
claurst-query     = { workspace = true }
claurst-tools     = { workspace = true }
claurst-tui       = { workspace = true }
dirs              = { workspace = true }
futures           = { workspace = true }
hostname          = "0.4"
once_cell         = { workspace = true }
open              = { workspace = true }
parking_lot       = { workspace = true }
qrcode            = { workspace = true }
regex             = { workspace = true }
reqwest           = { workspace = true }
serde             = { workspace = true }
serde_json        = { workspace = true }
tempfile          = { workspace = true }
tokio             = { workspace = true }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
tracing           = { workspace = true }
urlencoding       = { workspace = true }
