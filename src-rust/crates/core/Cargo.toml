[package]
authors.workspace      = true
edition.workspace      = true
license.workspace      = true
name                   = "claurst-core"
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[features]
# Enable real microphone capture via cpal.
# Without this feature the VoiceRecorder compiles but start_recording()
# returns an error instead of accessing hardware.
voice = ["dep:cpal"]

# Experimental/feature-flagged capabilities
default = ["ultraplan", "voice"]

# Interaction & UI features
away_summary    = []
history_picker  = []
hook_prompts    = []
kairos_brief    = []
kairos_channels = []
lodestone       = []
message_actions = []
quick_search    = []
token_budget    = []
ultraplan       = []
ultrathink      = []

# Agents & Memory features
agent_memory_snapshot       = []
agent_triggers              = []
agent_triggers_remote       = []
builtin_explore_plan_agents = []
cached_microcompact         = []
compaction_reminders        = []
extract_memories            = []
teammem                     = []
verification_agent          = []

# Tools & Infrastructure features
bash_classifier              = []
bridge_mode                  = []
ccr_auto_connect             = []
ccr_mirror                   = []
ccr_remote_setup             = []
connector_text               = []
mcp_rich_output              = []
native_clipboard_image       = []
new_init                     = []
powershell_auto_mode         = []
prompt_cache_break_detection = []
shot_stats                   = []
tree_sitter_bash             = []
tree_sitter_bash_shadow      = []
unattended_retry             = []

# Full dev build — includes all experimental features (36 total)
dev_full = [
  "agent_memory_snapshot",
  "agent_triggers",
  "agent_triggers_remote",
  "away_summary",
  "bash_classifier",
  "bridge_mode",
  "builtin_explore_plan_agents",
  "cached_microcompact",
  "ccr_auto_connect",
  "ccr_mirror",
  "ccr_remote_setup",
  "compaction_reminders",
  "connector_text",
  "extract_memories",
  "history_picker",
  "hook_prompts",
  "kairos_brief",
  "kairos_channels",
  "lodestone",
  "mcp_rich_output",
  "message_actions",
  "native_clipboard_image",
  "new_init",
  "powershell_auto_mode",
  "prompt_cache_break_detection",
  "quick_search",
  "shot_stats",
  "teammem",
  "token_budget",
  "tree_sitter_bash",
  "tree_sitter_bash_shadow",
  "ultraplan",
  "ultrathink",
  "unattended_retry",
  "verification_agent",
  "voice",
]

[dependencies]
anyhow            = { workspace = true }
base64            = { workspace = true }
chrono            = { workspace = true }
dashmap           = { workspace = true }
dirs              = { workspace = true }
futures           = { workspace = true }
getrandom         = { workspace = true }
glob              = { workspace = true }
hex               = { workspace = true }
indexmap          = { workspace = true }
once_cell         = { workspace = true }
parking_lot       = { workspace = true }
regex             = { workspace = true }
reqwest           = { workspace = true }
rusqlite          = { workspace = true }
serde             = { workspace = true }
serde_json        = { workspace = true }
sha2              = { workspace = true }
thiserror         = { workspace = true }
tokio             = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util        = { workspace = true }
tracing           = { workspace = true }
url               = { workspace = true }
urlencoding       = { workspace = true }
uuid              = { workspace = true }
# Optional: real audio capture for voice input (gated behind the `voice` feature)
cpal = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
